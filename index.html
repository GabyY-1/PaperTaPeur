<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PaperTaPeur</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="menu" class="screen active">
      <div class="brand">
        <div class="logo-mark">P</div>
        <h1>PaperTaPeur</h1>
        <p>Conquiers la map. Protège ta trace. Reste en vie.</p>
      </div>

      <div class="menu-card">
        <label for="playerName">Ton pseudo</label>
        <input id="playerName" maxlength="16" value="Player" autocomplete="off">
        <button id="playBtn">JOUER</button>
        <div class="stats-row">
          <span>🪙 <strong id="menuCoins">0</strong></span>
          <span>🏆 Record <strong id="bestScore">0%</strong></span>
        </div>
      </div>

      <p class="hint">Déplacement : ZQSD / WASD ou flèches</p>
    </section>

    <section id="game" class="screen">
      <canvas id="gameCanvas"></canvas>

      <div id="hud">
        <div class="pill"><span id="hudName">Player</span></div>
        <div class="pill">Territoire <strong id="territory">0.0%</strong></div>
        <div class="pill">🪙 <strong id="coins">0</strong></div>
      </div>

      <div id="leaderboard">
        <div class="lb-title">CLASSEMENT</div>
        <ol id="leaderboardList"></ol>
      </div>

      <button id="quitBtn" aria-label="Quitter">×</button>
    </section>

    <section id="gameover" class="screen overlay">
      <div class="gameover-card">
        <h2>Partie terminée</h2>
        <p>Territoire : <strong id="finalScore">0%</strong></p>
        <p>Pièces gagnées : <strong id="earnedCoins">0</strong></p>
        <button id="retryBtn">REJOUER</button>
        <button id="menuBtn" class="secondary">MENU</button>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
